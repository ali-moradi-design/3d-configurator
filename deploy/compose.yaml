# /srv/apps/3d-configurator/compose.yaml: the site (Next.js standalone server).
# No database. The image is built in CI and only pulled here. .env next to this
# file holds IMAGE_TAG (the commit SHA to run).
name: 3d-configurator

services:
  web:
    image: ghcr.io/ali-moradi-design/3d-configurator-web:${IMAGE_TAG:?IMAGE_TAG is not set}
    # Nginx on the host proxies to this; Docker bypasses ufw, so loopback only
    ports:
      - '127.0.0.1:3116:3000'
    read_only: true
    tmpfs:
      - /tmp
      # Next.js may write its cache here; uid/gid of the image's node user
      - '/app/.next/cache:uid=1000,gid=1000'
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    restart: unless-stopped
