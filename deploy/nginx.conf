# Server block for 3d-configurator.ali-moradi-develop.com (roadmap phase 7).
# Static export is rsynced to /srv/static/3d-configurator. Certbot adds the 443 block.
server {
    listen 80;
    server_name 3d-configurator.ali-moradi-develop.com;
    root /srv/static/3d-configurator;
    index index.html;

    include mime.types;
    types {
        model/gltf-binary glb;
        application/octet-stream hdr;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/octet-stream;

    # Hashed build files never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Models, HDRIs and posters are replaced only with a new file name.
    location ~* \.(glb|hdr|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
