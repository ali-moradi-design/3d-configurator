# 3d-configurator.ali-moradi-develop.com -> the web container on 127.0.0.1:3116.
# The app sets its own headers in next.config.ts: HSTS, nosniff, and for the 3D
# files `model/gltf-binary` / `image/vnd.radiance` with a one-year immutable cache.
# There is no database and nothing to submit, so Nginx only lets reads through.
#
# Install: /etc/nginx/sites-available/3d-configurator, symlink into sites-enabled,
# `nginx -t`, `systemctl reload nginx`. certbot --nginx then adds the TLS block.

server {
    listen 80;
    listen [::]:80;
    server_name 3d-configurator.ali-moradi-develop.com;

    server_tokens off;
    client_max_body_size 1k;      # nothing is ever uploaded here
    client_body_timeout 10s;
    client_header_timeout 10s;

    # The server-wide gzip.conf types plus the 3D files (the HDRI shrinks ~27%).
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml model/gltf-binary image/vnd.radiance;

    # Only reading is possible: POST/PUT/DELETE… get 405 before reaching Node.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Hidden files (.git, .env…) are never served.
    location ~ /\.(?!well-known/) { deny all; }

    location / {
        proxy_pass http://127.0.0.1:3116;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # always overwrite: visitors cannot choose their own IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
